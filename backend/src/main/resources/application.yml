server:
  port: 8080

spring:
  application:
    name: landmark-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/landmark_db}
    username: ${SPRING_DATASOURCE_USERNAME:landmark_user}
    password: ${SPRING_DATASOURCE_PASSWORD:landmark_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
