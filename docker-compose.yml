services:
  db:
    image: postgis/postgis:16-3.4
    container_name: landmark-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landmark_db}
      POSTGRES_USER: ${POSTGRES_USER:-landmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landmark_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landmark_user} -d ${POSTGRES_DB:-landmark_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landmark-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-landmark_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-landmark_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-landmark_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tM/Lavz+teGCpzrPfvjhVK9djZV6tPAoaJaoaGjJkvU=}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: landmark-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
